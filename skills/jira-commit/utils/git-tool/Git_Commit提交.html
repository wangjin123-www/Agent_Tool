<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git提交日志生成器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-primary: #0a0d0f;
            --bg-secondary: #141820;
            --bg-tertiary: #1e2430;
            --bg-glass: rgba(30, 36, 48, 0.7);
            --border-primary: #2a3244;
            --border-secondary: #1e2430;
            --text-primary: #e4e7ea;
            --text-secondary: #a0a9b8;
            --text-muted: #6b7382;
            --accent-primary: #00ff88;
            --accent-secondary: #00ccff;
            --accent-tertiary: #9d4edd;
            --accent-warning: #ffa657;
            --accent-danger: #ff6b6b;
            --gradient-primary: linear-gradient(135deg, #00ff88, #00ccff);
            --gradient-secondary: linear-gradient(135deg, #9d4edd, #ff006e);
            --shadow-glow: 0 0 30px rgba(0, 255, 136, 0.3);
            --shadow-glow-cyan: 0 0 30px rgba(0, 204, 255, 0.3);
        }

        body {
            font-family: 'Exo 2', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0d0f 0%, #141820 50%, #0a0d0f 100%);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 204, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(157, 78, 221, 0.05) 0%, transparent 40%),
                linear-gradient(45deg, transparent 48%, rgba(255, 166, 87, 0.02) 49%, rgba(255, 166, 87, 0.02) 51%, transparent 52%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 60px 60px;
            pointer-events: none;
            z-index: 1;
            animation: backgroundShift 25s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
            33% { transform: translate(-5px, -5px) rotate(0.5deg); opacity: 1; }
            66% { transform: translate(5px, -3px) rotate(-0.5deg); opacity: 0.9; }
        }

        .particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.6;
        }

    
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideDown 0.8s ease-out;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-primary);
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        .terminal-dot:hover {
            transform: scale(1.1);
        }

        .terminal-dot.red { background: var(--danger); }
        .terminal-dot.yellow { background: var(--warning); }
        .terminal-dot.green { background: var(--success); }

        .terminal-title {
            margin-left: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--text-muted);
            flex: 1;
        }
        .back-button {
            background: var(--bg-tertiary);
            color: var(--terminal-green);
            border: 1px solid var(--border-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background: var(--border-primary);
            box-shadow: 0 0 12px rgba(126, 231, 135, 0.2);
        }

        h1 {
            color: var(--terminal-green);
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            text-shadow: 0 0 20px rgba(126, 231, 135, 0.3);
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-primary);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-glow);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .card-title::before {
            content: '⚡';
            font-size: 1.5rem;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(10deg); }
        }

        .form-group {
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background: rgba(30, 36, 48, 0.5);
            border: 1px solid var(--border-secondary);
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .form-group::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-primary);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .form-group:hover::after {
            transform: scaleX(1);
        }

        .form-group:hover {
            background: rgba(30, 36, 48, 0.8);
            transform: translateX(4px);
            border-color: var(--accent-primary);
        }

      
        label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: var(--accent-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label strong {
            color: var(--accent-secondary);
            font-weight: 700;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(10, 13, 15, 0.7);
            border: 1px solid var(--border-secondary);
            border-radius: 12px;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(0, 255, 136, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            transform: scale(1.02);
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 0.5rem;
            accent-color: var(--accent-primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: rgba(30, 36, 48, 0.3);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .checkbox-group:hover {
            background: rgba(0, 255, 136, 0.05);
            transform: translateX(4px);
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 400;
            color: var(--text-secondary);
            text-transform: none;
            letter-spacing: 0;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            background: var(--gradient-primary);
            border: none;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #0a0d0f;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.4);
        }

        .btn-copy {
            background: linear-gradient(135deg, #3fb950, #00ff88);
        }

        .btn-reset {
            background: linear-gradient(135deg, var(--text-muted), #8b949e);
        }

        .btn-undo {
            background: linear-gradient(135deg, var(--accent-warning), #ffa657);
        }

        .btn-clear {
            background: linear-gradient(135deg, var(--accent-danger), #ff6b6b);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, var(--terminal-green), #6ab04c);
            color: var(--bg-primary);
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            display: block;
            width: 100%;
            margin-top: 25px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(126, 231, 135, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .button-group button {
            margin-top: 0;
            font-size: 12px;
            padding: 12px 16px;
        }

        #btn-copy {
            background: linear-gradient(135deg, var(--terminal-cyan), var(--accent-secondary));
        }

        #btn-copy:hover {
            box-shadow: 0 8px 25px rgba(88, 166, 255, 0.3);
        }

        #btn-reset {
            background: linear-gradient(135deg, var(--text-muted), var(--text-secondary));
        }

        #btn-reset:hover {
            box-shadow: 0 8px 25px rgba(139, 148, 158, 0.2);
        }

        #btn-undo {
            background: linear-gradient(135deg, var(--warning), #f39c12);
        }

        #btn-undo:hover {
            box-shadow: 0 8px 25px rgba(210, 153, 34, 0.3);
        }

        #btn-clear-log {
            background: linear-gradient(135deg, var(--danger), #c0392b);
        }

        #btn-clear-log:hover {
            box-shadow: 0 8px 25px rgba(248, 81, 73, 0.3);
        }
        .result-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-primary);
            border-radius: 24px;
            padding: 2rem;
            margin-top: 2rem;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-warning), var(--accent-tertiary), var(--accent-secondary));
            animation: colorShift 4s ease-in-out infinite;
        }

        @keyframes colorShift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }

        .result-title {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-warning), var(--accent-tertiary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .result-title::before {
            content: '📄';
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        #output {
            width: 100%;
            min-height: 350px;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-secondary);
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent-primary);
            line-height: 1.7;
            resize: vertical;
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        #output:focus {
            outline: none;
            border-color: var(--accent-secondary);
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.2);
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container { padding: 1.5rem; }
            .card { padding: 1.5rem; }
            .buttons-grid {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <canvas class="particle-canvas" id="particlesCanvas"></canvas>

    <div class="container">
        <header class="header">
            <button class="back-button" onclick="goBack()" style="display: none;">
                ← 返回工具选择
            </button>

            <h1>Git 提交日志生成器</h1>
            <p class="subtitle">智能化的代码提交信息生成工具</p>
            <p class="auto-save">✓ 所有内容自动保存</p>
        </header>
        
        <form id="commit-form">
            <div class="main-grid">
                <div class="card">
                    <h2 class="card-title">基础配置</h2>

                    <div class="form-group">
                        <label for="commit_mode">提交模式</label>
                        <select id="commit_mode" onchange="toggleCommitMode()">
                            <option value="single" selected>单个提交</option>
                            <option value="multiple">多个提交 (merge request)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="commit_type">1. 提交类型</label>
                        <select id="commit_type">
                            <option value="bugfix" selected>bugfix (针对BUG的修改和完善)</option>
                            <option value="feature">feature (功能和需求的修改和完善)</option>
                            <option value="config">config (客户配置和参数的修改)</option>
                            <option value="merge">merge (合并其他分支已解决问题或功能)</option>
                            <option value="revert">revert (还原已提交修改项)</option>
                        </select>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="enable_module" onchange="toggleInput('module', this.checked)">
                        <label for="enable_module">2. 模块/项目 (e.g., 250MY24)</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="module" placeholder="模块或项目名称..." disabled>
                    </div>

                    <div id="single-jira-section" class="form-group">
                        <label for="jira_id">3. JIRA ID (可选，e.g., ICS0707-4522)</label>
                        <input type="text" id="jira_id" placeholder="可选填写JIRA ID...">
                    </div>

                    <div id="multiple-commits-section" class="hidden">
                        <div class="form-group">
                            <label for="jira_ids">3. 多个 JIRA ID (用逗号分隔)</label>
                            <input type="text" id="jira_ids" placeholder="IMT1206-4298,IMT1206-4299">
                        </div>
                        <div class="form-group">
                            <label for="commit_count">提交数量</label>
                            <input type="number" id="commit_count" value="2" min="1" max="10" onchange="generateCommitForms()">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2 class="card-title">详细信息</h2>

                    <div id="single-commit-section">
                        <div class="checkbox-group">
                            <input type="checkbox" id="enable_customer" onchange="toggleInput('customer_name', this.checked)">
                            <label for="enable_customer">客户信息</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="customer_name" placeholder="提出问题、需求或订单的客户名称..." disabled>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="enable_part" onchange="toggleInput('part_info', this.checked)">
                            <label for="enable_part">分部分标识 [Part N/M]</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="part_info" placeholder="N/M" disabled>
                        </div>

                        <div class="form-group">
                            <label for="summary_en">4. 摘要</label>
                            <input type="text" id="summary_en" placeholder="Fix an issue that SOS Call=manual mode...">
                        </div>

                        <div class="form-group">
                            <label for="what_cn">5. <strong>[what]</strong> 中文描述 (问题现象)</label>
                            <textarea id="what_cn" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="why_cn">6. <strong>[why]</strong> 中文描述 (问题原因)</label>
                            <textarea id="why_cn" rows="4"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="how_cn">7. <strong>[how]</strong> 中文描述 (解决方法)</label>
                            <textarea id="how_cn" rows="4"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="impact_level">8. <strong>[影响等级]</strong></label>
                            <select id="impact_level">
                                <option value="S">S (系统级)</option>
                                <option value="A">A (应用级)</option>
                                <option value="B" selected>B (模块级)</option>
                                <option value="C">C (组件级)</option>
                                <option value="D">D (细节级)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="test_scope">9. <strong>[测试范围]</strong> 建议句式：测试对象+测试场景+动作描述/考察内容。</label>
                            <textarea id="test_scope" rows="3"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="commit-controls hidden" id="commit-controls">
                <button type="button" class="btn" onclick="toggleAllCommits()" id="toggle-all-btn">
                    📁 折叠所有表单
                </button>
            </div>

            <div id="commits-container"></div>
        </form>

        <div class="buttons-grid">
            <button type="button" class="btn" onclick="generate()">
                ⚡ 生成提交日志
            </button>
            <button type="button" class="btn btn-copy" onclick="copyToClipboard()">
                📋 复制到剪贴板
            </button>
            <button type="button" class="btn btn-reset" onclick="resetForm()">
                🔄 清空表单
            </button>
            <button type="button" class="btn btn-undo" onclick="undoForm()">
                ↩️ 撤回清空前
            </button>
            <button type="button" class="btn btn-clear" onclick="clearLog()">
                🗑️ 清空日志
            </button>
        </div>

        <div id="result-container">
            <div class="result-card">
                <h2 class="result-title">生成的日志</h2>
                <textarea id="output" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        class ParticleAnimation {
            constructor() {
                this.canvas = document.getElementById('particlesCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.init();
                this.animate();

                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                // 创建Git主题的粒子
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 2 + 1,
                        speedX: (Math.random() - 0.5) * 0.5,
                        speedY: (Math.random() - 0.5) * 0.5,
                        opacity: Math.random() * 0.5 + 0.2,
                        color: ['#00ff88', '#00ccff', '#9d4edd', '#ffa657'][Math.floor(Math.random() * 4)]
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.particles.forEach(particle => {
                    // 更新位置
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;

                    // 边界检测
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.speedX *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.speedY *= -1;

                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = particle.color;
                    this.ctx.globalAlpha = particle.opacity;
                    this.ctx.fill();
                });

                // 绘制连接线
                this.particles.forEach((p1, i) => {
                    this.particles.slice(i + 1).forEach(p2 => {
                        const distance = Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
                        if (distance < 100) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p1.x, p1.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = p1.color;
                            this.ctx.globalAlpha = (1 - distance / 100) * 0.2;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.stroke();
                        }
                    });
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 显示返回按钮
            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.style.display = 'inline-flex';
            }

            // 初始化粒子动画
            new ParticleAnimation();
        });
    </script>

    <script src="script.js"></script>
    <script src="../global-back-button.js"></script>
</body>
</html>
